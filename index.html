
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 Years Together 💗</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#fff0e9;
 font-family:'Courier New',monospace;
 overflow:hidden;
}

.card{
 width:min(340px,90vw);
 background:#f8c4d3;
 border:3px solid #df829a;
 border-radius:10px;
 box-shadow:0 12px 30px #c98b9b55;
 text-align:center;
 overflow:hidden;
 z-index:2;
}

.top{
 padding:13px;
 border-bottom:3px solid #df829a;
 color:#77344c;
 font-weight:bold;
}

.content{padding:25px 15px}

h2{
 font-size:18px;
 line-height:1.7;
 color:#77344c;
}

.cat{
 font-size:75px;
 margin:15px;
 animation:bounce 1s infinite alternate;
}

@keyframes bounce{
 to{transform:translateY(-10px)}
}

.buttons{
 display:flex;
 justify-content:center;
 gap:18px;
 margin-top:20px;
}

button{
 background:#fff8f8;
 border:2px solid #dc829a;
 color:#a54c68;
 border-radius:7px;
 padding:11px 22px;
 font-weight:bold;
 font-family:inherit;
 cursor:pointer;
}

#result{
 display:none;
 color:#9c3e60;
 line-height:1.8;
 margin-top:20px;
 font-size:15px;
}

.heart{
 position:fixed;
 top:-30px;
 animation:fall 5s linear forwards;
 pointer-events:none;
}

@keyframes fall{
 to{
  transform:translateY(110vh) rotate(360deg);
  opacity:0;
 }
}
</style>
</head>

<body>

<div class="card">
 <div class="top">♡ A SPECIAL LETTER ♡</div>

 <div class="content">

  <h2>
   Happy 3 Years, My Love ♡
   <br>
   Still Love Me?
  </h2>

  <div class="cat">🐱💗</div>

  <div class="buttons">
   <button id="no">NO</button>
   <button id="yes" onclick="showLove()">YES</button>
  </div>

  <div id="result">
   💗 YAY! 💗
   <br>
   Happy 3 Years Together!
   <br>
   Thank you for being a part of my life.
   <br>
   Stay Happy Always! 🌸
  </div>

 </div>
</div>

<script>

const no=document.getElementById("no");

function moveNo(){
 no.style.position="fixed";
 no.style.left=Math.random()*65+"vw";
 no.style.top=Math.random()*75+"vh";
}

no.addEventListener("click",moveNo);
no.addEventListener("touchstart",moveNo);

function showLove(){

 document.getElementById("result").style.display="block";
 document.querySelector(".buttons").style.display="none";

 for(let i=0;i<45;i++){
  setTimeout(createHeart,i*80);
 }
}

function createHeart(){

 const h=document.createElement("div");

 h.className="heart";

 h.innerHTML=["💗","💕","💖","❤️","🌸"][
 Math.floor(Math.random()*5)
 ];

 h.style.left=Math.random()*100+"vw";
 h.style.fontSize=(15+Math.random()*20)+"px";

 document.body.appendChild(h);

 setTimeout(()=>h.remove(),5000);
}

setInterval(createHeart,650);

</script>

</body>
</html>
